<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/lautech-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#065f46" />
    <meta name="description" content="LAUTECH Chemical Engineering Departmental Payment & Receipt Verification Portal" />
    <link rel="preconnect" href="https://ydkxzalmznhtqsrvplqe.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ydkxzalmznhtqsrvplqe.supabase.co" />
    <title>DeptPay | LAUTECH Chemical Engineering 300L</title>
    <style>
      #initial-loader {
  position: fixed;
  inset: 0;
  background: #0f172a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  font-family: system-ui, -apple-system, sans-serif;
}

.loader-logo-wrapper {
  width: 80px;
  height: 80px;
  border-radius: 16px;
  background: white;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2);
  margin-bottom: 24px;
}

.loader-logo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.brand-title {
  color: white;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}

.brand-title span {
  color: #34d399;
}

.brand-sub {
  color: #94a3b8;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  margin-bottom: 40px;
}

.loader-track {
  width: 200px;
  height: 6px;
  background: #1e293b;
  border-radius: 999px;
  overflow: hidden;
}

.loader-fill {
  height: 100%;
  background: #10b981;
  border-radius: 999px;
  animation: fill-bar 2s ease-in-out forwards;
}

@keyframes fill-bar {
  0% { width: 0%; }
  40% { width: 45%; }
  70% { width: 65%; }
  100% { width: 100%; }
}
    </style>
  </head>
  <body>
    <div id="root">
  <div id="initial-loader">
    <div class="loader-logo-wrapper">
      <img src="/lautech-logo.png" alt="LAUTECH Crest" class="loader-logo" />
    </div>
    <div class="brand-title">Dept<span>Pay</span></div>
    <div class="brand-sub">Secure Payment Portal</div>
    <div class="loader-track">
      <div class="loader-fill"></div>
    </div>
  </div>
</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
